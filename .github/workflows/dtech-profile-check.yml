name: Verify public DTech Kakao profile endpoint
on:
  push:
    branches: [main]
    paths:
      - 'dtech-source.js'
      - '.github/workflows/dtech-profile-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-profile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Request public channel metadata (no credentials)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          url='https://pf.kakao.com/rocket-web/web/profiles/_nkwxeG/home'
          request=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'SandsLunchClub/1.0'})
          try:
              with urllib.request.urlopen(request,timeout=15) as res:
                  content_type=res.headers.get('Content-Type','')
                  body=res.read(300000)
                  print('HTTP status:',res.status,'content-type:',content_type,'bytes:',len(body))
                  if res.status!=200 or 'application/json' not in content_type:
                      raise ValueError('unexpected response status or type')
                  obj=json.loads(body.decode('utf-8','replace'))
                  profile=obj.get('profile') or {}
                  img=profile.get('profile_image') or {}
                  image_url=img.get('xlarge_url') or img.get('url') or img.get('large_url') or img.get('medium_url') or ''
                  print('channel ID matches:',obj.get('profile_id')=='_nkwxeG' and profile.get('profile_id')=='_nkwxeG')
                  print('profile image type:',img.get('type'))
                  print('profile image host:',urllib.parse.urlsplit(image_url).hostname)
                  if obj.get('profile_id')!='_nkwxeG' or profile.get('profile_id')!='_nkwxeG' or not image_url:
                      raise ValueError('channel mismatch or missing profile image')
                  print('PASS: public channel metadata and profile image are available')
          except Exception as exc:
              print('FAIL: public endpoint check:',type(exc).__name__,str(exc)[:180])
              raise
          PY
